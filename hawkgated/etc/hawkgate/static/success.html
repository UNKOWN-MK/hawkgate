<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HawkGate — Connected</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #2a2d3a;
    --accent:    #4f8ef7;
    --green:     #34c97e;
    --green-dim: rgba(52,201,126,.1);
    --text-1:    #f0f2f8;
    --text-2:    #8b90a8;
    --text-3:    #6b7090;
    --radius:    14px;
    --shadow:    0 24px 64px rgba(0,0,0,.55);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 40%,
        rgba(52,201,126,.06) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 48px 36px 40px;
    box-shadow: var(--shadow);
    text-align: center;
  }

  /* animated check circle */
  .check-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 28px;
    position: relative;
  }

  .check-ring {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 1.5px solid var(--green);
    background: var(--green-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pop .4s cubic-bezier(.34,1.56,.64,1) both;
  }

  @keyframes pop {
    from { transform: scale(.6); opacity: 0; }
    to   { transform: scale(1);  opacity: 1; }
  }

  .check-ring svg {
    animation: draw .4s .2s ease both;
    stroke-dasharray: 28;
    stroke-dashoffset: 28;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  /* pulse ring */
  .check-wrap::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid var(--green);
    opacity: 0;
    animation: pulse 2s 1s ease-out infinite;
  }

  @keyframes pulse {
    0%   { transform: scale(.9); opacity: .4; }
    100% { transform: scale(1.2); opacity: 0; }
  }

  h1 {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -.4px;
    color: var(--text-1);
    margin-bottom: 10px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.6;
    margin-bottom: 36px;
  }

  /* countdown bar */
  .progress-wrap {
    background: var(--border);
    border-radius: 99px;
    height: 3px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .progress-bar {
    height: 100%;
    background: var(--green);
    border-radius: 99px;
    width: 100%;
    animation: drain var(--duration, 5s) linear forwards;
    transform-origin: left;
  }

  @keyframes drain {
    from { width: 100%; }
    to   { width: 0%; }
  }

  .countdown-label {
    font-size: 12px;
    color: var(--text-3);
    margin-bottom: 28px;
  }

  /* divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 24px;
  }

  /* info rows */
  .info-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
    text-align: left;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-2);
  }

  .info-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    opacity: .7;
  }

  /* browse button */
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
    text-align: center;
    text-decoration: none;
  }

  .btn:hover {
    background: rgba(79,142,247,.06);
    border-color: var(--accent);
  }

  /* logo top */
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 32px;
  }

  .logo-text {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-2);
    letter-spacing: -.2px;
  }

  .logo-text span { color: var(--accent); }

  /* signature */
  .signature {
    position: fixed;
    bottom: 18px;
    right: 22px;
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: .4px;
    z-index: 2;
    user-select: none;
    font-style: italic;
  }

  @media (max-width: 440px) {
    .card { padding: 36px 24px 32px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 36 36" fill="none">
      <path d="M18 4L9 11v8c0 5 3.8 9.6 9 10.7C23.2 28.6 27 24 27 19v-8L18 4z"
            fill="none" stroke="#4f8ef7" stroke-width="2"
            stroke-linejoin="round"/>
      <path d="M13 19l3 3 7-7"
            stroke="#4f8ef7" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="logo-text">Hawk<span>Gate</span></span>
  </div>

  <!-- animated check -->
  <div class="check-wrap">
    <div class="check-ring">
      <svg width="28" height="28" fill="none"
           stroke="#34c97e" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 8 11 19 6 14"/>
      </svg>
    </div>
  </div>

  <h1>You're connected</h1>
  <p class="subtitle">
    Internet access is now active.<br>
    Your session has started.
  </p>

  <!-- countdown -->
  <div class="progress-wrap">
    <div class="progress-bar" id="bar"></div>
  </div>
  <p class="countdown-label" id="label">Redirecting in 5 seconds…</p>

  <div class="divider"></div>

  <div class="info-grid">
    <div class="info-row">
      <span class="info-dot"></span>
      <span>Session is active and monitored for fair use</span>
    </div>
    <div class="info-row">
      <span class="info-dot"></span>
      <span>Close this tab and browse normally</span>
    </div>
  </div>

  <a href="http://example.com" class="btn" id="browse-btn">
    Start browsing now
  </a>

</div>

<div class="signature">belong to infinity</div>

<script>
  var REDIRECT_URL = "http://example.com";
  var SECS = 5;
  var remaining = SECS;
  var label = document.getElementById("label");
  var bar   = document.getElementById("bar");

  bar.style.setProperty("--duration", SECS + "s");

  var timer = setInterval(function() {
    remaining--;
    if (remaining <= 0) {
      clearInterval(timer);
      window.location.href = REDIRECT_URL;
    } else {
      label.textContent = "Redirecting in " + remaining + " second" +
                          (remaining === 1 ? "" : "s") + "…";
    }
  }, 1000);

  document.getElementById("browse-btn").addEventListener("click", function() {
    clearInterval(timer);
  });
</script>

</body>
</html>
