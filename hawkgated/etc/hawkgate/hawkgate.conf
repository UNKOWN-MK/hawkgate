# HawkGate daemon configuration
log_level       = info        # debug | info | warning | error
iface_name      = br0
http_port       = 2050
portal_ip       = 192.168.100.1
gateway_fqdn    = portal.hawkgate.local
session_timeout = 3600
max_clients     = 4096
u_rate          = 5120        # kbps upload limit per client
d_rate          = 10240       # kbps download limit per client
quota           = 0           # bytes per session; 0 = unlimited
portal_mode     = builtin     # builtin | external_url (future)

# Pre-authentication protocol allow rules
# These protocols are allowed for all clients before they authenticate.
# Supported l2: arp, ipv4, ipv6, vlan, pppoe
# Supported l3: icmp, igmp, tcp, udp, gre, esp, ah, icmpv6, ospf, sctp
# Supported l4: dns, dhcp, ntp, http, https, mdns, llmnr, syslog, snmp
# Note: l4 rules are applied in both directions automatically.
# For runtime changes use: hgctl proto -a add -i <iface> --l4 <proto:sport:dport>

[preauth-protocol]
l2 = arp
l3 = icmp
l4 = dns, dhcp, ntp

# Walled garden — IPs/subnets unauthenticated clients can reach (IP-based only,
# no DNS dependency). Common uses: payment gateway, hotel website, terms page,
# local network resources. Repeat "ip =" for each entry.
# For runtime changes use: hgctl wg-add --ip <ip>[/prefix]
[walled_garden]
# ip = 93.184.216.34        # example.com
# ip = 192.168.1.0/24       # local subnet

# CAPPORT API (RFC 8910) — for iOS 14+ and Android 11+ captive detection
# Add this to your dnsmasq config to advertise the CAPPORT endpoint:
#   dhcp-option=114,"http://portal.hawkgate.local:2050/api/v1/capport"
