# HawkGate daemon configuration
iface_name      = br0
http_port       = 2050
portal_ip       = 192.168.100.22
gateway_fqdn    = portal.hawkgate.local
session_timeout = 3600
max_clients     = 4096
u_rate          = 5120        # kbps upload limit per client
d_rate          = 10240       # kbps download limit per client
quota           = 0           # bytes per session; 0 = unlimited
portal_mode     = builtin     # builtin | external_url (future)
